# Factory Direct - Cucumber BDD Test Automation Pipeline
# Runs Cucumber BDD tests with configurable tags
# No parallel execution to avoid Azure parallelism requirements

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    exclude:
      - README.md
      - docs/*

pr:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/*

variables:
  - name: nodeVersion
    value: '18.x'
  - name: testResultsPath
    value: 'test-results'
  - name: reportsPath
    value: 'reports'
  - name: cucumberReportsPath
    value: 'reports'

parameters:
  - name: runCucumberTests
    displayName: 'Run Cucumber BDD Tests'
    type: boolean
    default: true
  - name: testTags
    displayName: 'Test Tags (e.g., @smoke, @regression, or leave empty for all)'
    type: string
    default: ''
  - name: generateReport
    displayName: 'Generate HTML Report'
    type: boolean
    default: true

stages:
  - stage: Build_Test_Report
    displayName: 'Build, Test and Report'
    jobs:
      - job: SingleJob
        displayName: 'Complete Pipeline Execution'
        pool:
          vmImage: 'windows-latest'
        timeoutInMinutes: 180
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache node_modules'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
                npm
              path: '$(System.DefaultWorkingDirectory)/node_modules'

          - script: |
              npm ci
              npm run build --if-present
            displayName: 'Install dependencies and build'
            env:
              NODE_ENV: test

          # Install browsers for Cucumber tests (using Playwright under the hood)
          - script: npx playwright install chromium
            displayName: 'Install Chrome browser for Cucumber tests'
            condition: ${{ parameters.runCucumberTests }}

          # Run Cucumber BDD tests based on tags
          - ${{ if parameters.runCucumberTests }}:
            - task: PowerShell@2
              displayName: 'Run Cucumber BDD Tests'
              inputs:
                targetType: 'inline'
                script: |
                  # Ensure reports directory exists
                  if (-not (Test-Path "reports")) { 
                    New-Item -ItemType Directory -Path "reports" -Force
                    Write-Host "Created reports directory"
                  }
                  
                  # Ensure test-results directory exists
                  if (-not (Test-Path "test-results")) { 
                    New-Item -ItemType Directory -Path "test-results" -Force
                    Write-Host "Created test-results directory"
                  }
                  
                  $testTags = "${{ parameters.testTags }}"
                  if ([string]::IsNullOrWhiteSpace($testTags)) {
                    Write-Host "Running all Cucumber tests..."
                    npm run cucumber:ci
                  } else {
                    Write-Host "Running Cucumber tests with tags: $testTags"
                    $env:CI = "true"
                    $env:HEADLESS = "true"
                    npx cucumber-js --tags $testTags
                  }
                  
                  # Copy cucumber JSON results to test-results directory for Azure DevOps
                  if (Test-Path "reports/cucumber-report.json") {
                    Copy-Item "reports/cucumber-report.json" "test-results/cucumber-report.json" -Force
                    Write-Host "✅ Copied Cucumber JSON results to test-results directory"
                  } else {
                    Write-Host "⚠️  No Cucumber JSON results found"
                  }
              env:
                CI: true
                HEADLESS: true
              continueOnError: true

          # Generate Cucumber HTML report
          - ${{ if and(parameters.runCucumberTests, parameters.generateReport) }}:
            - task: PowerShell@2
              displayName: 'Generate Cucumber HTML Report'
              inputs:
                targetType: 'inline'
                script: |
                  Write-Host "Checking for Cucumber JSON report..."
                  if (Test-Path "reports/cucumber-report.json") {
                    Write-Host "✅ JSON report found, generating HTML report..."
                    npm run cucumber:report
                    
                    # Also copy HTML report to test-results for easier access
                    if (Test-Path "reports/cucumber-report.html") {
                      Copy-Item "reports/cucumber-report.html" "test-results/cucumber-report.html" -Force
                      Write-Host "✅ Copied HTML report to test-results directory"
                    }
                  } else {
                    Write-Host "⚠️  JSON report not found, creating minimal report..."
                    # Ensure reports directory exists
                    if (-not (Test-Path "reports")) { 
                      New-Item -ItemType Directory -Path "reports" -Force
                    }
                    # Run the report generator anyway - it will handle the missing file gracefully
                    npm run cucumber:report
                  }
              condition: always()
              continueOnError: true

          # Publish test results in JUnit format for Azure DevOps Test Results
          - task: PublishTestResults@2
            displayName: 'Publish Cucumber Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/*junit*.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: 'Cucumber BDD Tests'
              publishRunAttachments: true
            condition: always()

          # Ensure directories exist before publishing artifacts
          - task: PowerShell@2
            displayName: 'Prepare test results for publishing'
            inputs:
              targetType: 'inline'
              script: |
                # Ensure directories exist
                if (-not (Test-Path "reports")) { 
                  New-Item -ItemType Directory -Path "reports" -Force
                  Write-Host "Created reports directory"
                }
                if (-not (Test-Path "test-results")) { 
                  New-Item -ItemType Directory -Path "test-results" -Force
                  Write-Host "Created test-results directory"
                }
                
                # List what files we have in reports
                Write-Host "📁 Files in reports directory:"
                if (Test-Path "reports") {
                  Get-ChildItem "reports" -Force | ForEach-Object { Write-Host "  - $($_.Name)" }
                }
                
                # Copy all report files to test-results for easier access
                if (Test-Path "reports/*") {
                  Copy-Item "reports/*" "test-results/" -Recurse -Force
                  Write-Host "✅ Copied all reports to test-results directory"
                }
                
                # List what files we have in test-results
                Write-Host "📁 Files in test-results directory:"
                if (Test-Path "test-results") {
                  Get-ChildItem "test-results" -Force | ForEach-Object { Write-Host "  - $($_.Name)" }
                }
            condition: always()

          # Publish Cucumber HTML and JSON reports as artifacts
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Cucumber Reports'
            inputs:
              targetPath: '$(reportsPath)'
              artifact: 'cucumber-reports'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Test Results & Screenshots'
            inputs:
              targetPath: '$(testResultsPath)'
              artifact: 'test-results'
              publishLocation: 'pipeline'
            condition: always()

          # Email notification on failure (optional)
          - task: PowerShell@2
            displayName: 'Send Email Notification on Failure'
            condition: failed()
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "Pipeline failed. Build URL: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                Write-Host "Manual review required."
            continueOnError: true