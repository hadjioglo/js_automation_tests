# Factory Direct - Cross-Browser Test Automation Pipeline
# Runs automated tests sequentially across multiple browsers
# No parallel execution to avoid Azure parallelism requirements

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    exclude:
      - README.md
      - docs/*

pr:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/*

variables:
  - name: nodeVersion
    value: '18.x'
  - name: testResultsPath
    value: 'test-results'
  - name: screenshotsPath
    value: 'test-results/screenshots'
  - name: reportsPath
    value: 'reports'

parameters:
  - name: runE2ETests
    displayName: 'Run E2E Tests'
    type: boolean
    default: true

stages:
  - stage: Build_Test_Report
    displayName: 'Build, Test and Report'
    jobs:
      - job: SingleJob
        displayName: 'Complete Pipeline Execution'
        pool:
          vmImage: 'windows-latest'
        timeoutInMinutes: 180
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache node_modules'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
                npm
              path: '$(System.DefaultWorkingDirectory)/node_modules'

          - script: |
              npm ci
              npm run build --if-present
            displayName: 'Install dependencies and build'
            env:
              NODE_ENV: test

          # Install browsers for E2E tests
          - script: npx playwright install chromium
            displayName: 'Install Chrome browser'
            condition: ${{ parameters.runE2ETests }}

          # Run E2E tests for Chrome only
          - ${{ if parameters.runE2ETests }}:
            - script: |
                npx playwright test --project=e2e-chromium --reporter=junit,html --workers=1
              displayName: 'Run E2E Tests - Chrome'
              env:
                BROWSER: chrome
                CI: true
              continueOnError: true

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'reports/junit.xml'
              failTaskOnFailedTests: true
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Screenshots'
            inputs:
              targetPath: '$(screenshotsPath)'
              artifact: 'screenshots'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish HTML Reports'
            inputs:
              targetPath: '$(reportsPath)'
              artifact: 'html-reports'
              publishLocation: 'pipeline'
            condition: always()

          # Email notification on failure (optional)
          - task: PowerShell@2
            displayName: 'Send Email Notification on Failure'
            condition: failed()
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "Pipeline failed. Build URL: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                Write-Host "Manual review required."
            continueOnError: true